apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shopstack.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shopstack.labels" . | nindent 4 }}
  annotations:
    # Argo CD will not sync a ConfigMap change into pods by itself; the checksum
    # annotation on the pod template is what triggers the rollout.
    argocd.argoproj.io/sync-options: Prune=false
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
