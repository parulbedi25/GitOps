{{- if and .Values.secrets.enabled .Values.secrets.data }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "shopstack.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shopstack.labels" . | nindent 4 }}
  annotations:
    # If the cloud secret manager is unreachable the ExternalSecret stays in a
    # degraded state while the last known-good Kubernetes Secret keeps working.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.secretStoreRef.name }}
    kind: {{ .Values.secrets.secretStoreRef.kind }}
  target:
    name: {{ include "shopstack.secretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range .Values.secrets.data }}
    - secretKey: {{ .name }}
      remoteRef:
        key: {{ .remoteRef.key }}
        {{- with .remoteRef.property }}
        property: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
