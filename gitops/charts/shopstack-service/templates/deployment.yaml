{{- if eq .Values.workload.kind "Deployment" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shopstack.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shopstack.labels" . | nindent 4 }}
  {{- with .Values.workload.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.workload.revisionHistoryLimit }}
  minReadySeconds: {{ .Values.workload.minReadySeconds }}
  progressDeadlineSeconds: {{ .Values.workload.progressDeadlineSeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      # Never take a pod out before a new one is ready: availability over speed.
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "shopstack.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shopstack.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- include "shopstack.podAnnotations" . | nindent 8 }}
    spec:
      {{- include "shopstack.podSpec" . | nindent 6 }}
{{- end }}
