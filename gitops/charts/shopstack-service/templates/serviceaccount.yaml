{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "shopstack.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shopstack.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No RBAC is bound to this account: application pods do not talk to the
# Kubernetes API. Workload identity annotations (e.g. for external-secrets or
# IRSA-style cloud access) go in serviceAccount.annotations.
{{- end }}
