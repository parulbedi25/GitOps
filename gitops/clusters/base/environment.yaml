# Namespaces, quotas, limit ranges and the default-deny network baseline.
# This is the first Application to become healthy on a fresh cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopstack-environment
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: shopstack
    shopstack.io/tier: platform
    shopstack.io/managed-by: gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: shopstack-platform
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: https://github.com/parulbedi25/GitOps.git
    targetRevision: main
    # Patched per cluster:
    path: gitops/environments/dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m
  revisionHistoryLimit: 5
