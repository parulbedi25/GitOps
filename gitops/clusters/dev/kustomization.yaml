# The dev cluster. Applied once by `kubectl apply -k gitops/clusters/dev`
# (or via gitops/bootstrap/root-app-dev.yaml). Everything after this is GitOps.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - ../base

patches:
  # Point every Application at the dev paths.
  - target:
      group: argoproj.io
      kind: Application
      name: shopstack-environment
    patch: |-
      - op: replace
        path: /spec/source/path
        value: gitops/environments/dev
  - target:
      group: argoproj.io
      kind: Application
      name: shopstack-security-policies
    patch: |-
      - op: replace
        path: /spec/source/path
        value: security/policies/overlays/dev
  # The ApplicationSet only walks this cluster's overlays.
  - target:
      group: argoproj.io
      kind: ApplicationSet
      name: shopstack-services
    patch: |-
      - op: replace
        path: /spec/generators/0/git/directories/0/path
        value: gitops/apps/overlays/dev/*

labels:
  - pairs:
      shopstack.io/managed-by: gitops
      shopstack.io/cluster: shopstack-dev
    includeSelectors: false
