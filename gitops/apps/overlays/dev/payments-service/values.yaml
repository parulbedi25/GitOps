# DEV values for payments-service.
#
# Composed by the kustomization next to this file (Kustomize helmCharts).
# Promotion changes the image reference in kustomization.yaml, not this file.
# The PSP webhook signing key is the only secret this service needs. It is
# synced from the cloud secret manager by the External Secrets Operator; the
# local kind cluster uses ESO's fake provider (see gitops/platform/controllers).

global:
  environment: dev
  imageRegistry: ghcr.io/parulbedi25

image:
  repository: shopstack/payments-service
  pullPolicy: IfNotPresent

tier: critical
replicaCount: 1
workload:
  kind: Deployment

config:
  NODE_ENV: "development"
  DEPLOYMENT_ENVIRONMENT: "dev"
  LOG_LEVEL: "debug"
  LOG_PRETTY: "false"
  SERVICE_NAME: "payments-service"
  ALLOW_CHAOS: "true"
  PSP_DRIVER: "simulated"
  PSP_FAILURE_RATE: "0"
  DB_DRIVER: "memory"

secrets:
  enabled: true
  optional: true
  refreshInterval: 1h
  data:
    - name: PSP_WEBHOOK_SECRET
      remoteRef:
        key: shopstack/dev/payments/psp_webhook_secret

networkPolicy:
  enabled: true
  allowedClients:
    - checkout-service
  allowIngressController: false
  allowPrometheus: true
  egressAllowSameNamespace: true
  allowDatabaseEgress: false

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 300m
    memory: 320Mi

podDisruptionBudget:
  enabled: false
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65

ingress:
  enabled: false
  className: nginx
  host: "payments-service.dev.shopstack.example.com"
  tls:
    enabled: false

monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
  canaryServiceMonitor: false
  dashboard:
    enabled: true

analysis:
  prometheusAddress: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
  canaryOnly: false
