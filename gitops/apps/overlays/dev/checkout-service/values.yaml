# DEV values for checkout-service.
#
# Composed by the kustomization next to this file (Kustomize helmCharts).
# Promotion changes the image reference in kustomization.yaml, not this file.
# Checkout is the only service allowed to call payments, catalog and cart.
# Its NetworkPolicy encodes that: only the storefront may call it, and it may
# call exactly the three dependencies above.

global:
  environment: dev
  imageRegistry: ghcr.io/parulbedi25

image:
  repository: shopstack/checkout-service
  pullPolicy: IfNotPresent

tier: critical
replicaCount: 1
workload:
  kind: Deployment

config:
  NODE_ENV: "development"
  DEPLOYMENT_ENVIRONMENT: "dev"
  LOG_LEVEL: "debug"
  LOG_PRETTY: "false"
  SERVICE_NAME: "checkout-service"
  ALLOW_CHAOS: "true"
  STEP_TIMEOUT_MS: "4000"
  DB_DRIVER: "memory"
  CATALOG_URL: "http://catalog-service.shopstack-dev.svc.cluster.local"
  CART_URL: "http://cart-service.shopstack-dev.svc.cluster.local"
  PAYMENTS_URL: "http://payments-service.shopstack-dev.svc.cluster.local"

secrets:
  enabled: false

networkPolicy:
  enabled: true
  allowedClients:
    - storefront
  allowIngressController: false
  allowPrometheus: true
  egressAllowSameNamespace: true
  allowDatabaseEgress: false

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 300m
    memory: 320Mi

podDisruptionBudget:
  enabled: false
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65

ingress:
  enabled: false
  className: nginx
  host: "checkout-service.dev.shopstack.example.com"
  tls:
    enabled: false

monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
  canaryServiceMonitor: false
  dashboard:
    enabled: true

analysis:
  prometheusAddress: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
  canaryOnly: false
