# DEV values for cart-service.
#
# Composed by the kustomization next to this file (Kustomize helmCharts).
# Promotion changes the image reference in kustomization.yaml, not this file.
# Production switch for the cart store (Redis keeps carts across pod restarts):
#   config:  { CART_DRIVER: redis }
#   secrets: { enabled: true, data: [{ name: REDIS_URL, remoteRef: { key: shopstack/<env>/cart, property: url } }] }

global:
  environment: dev
  imageRegistry: ghcr.io/parulbedi25

image:
  repository: shopstack/cart-service
  pullPolicy: IfNotPresent

tier: core
replicaCount: 1
workload:
  kind: Deployment

config:
  NODE_ENV: "development"
  DEPLOYMENT_ENVIRONMENT: "dev"
  LOG_LEVEL: "debug"
  LOG_PRETTY: "false"
  SERVICE_NAME: "cart-service"
  ALLOW_CHAOS: "true"
  TAX_RATE_BPS: "825"
  SHIPPING_FEE_CENTS: "599"
  FREE_SHIPPING_THRESHOLD_CENTS: "7500"
  CART_TTL_SECONDS: "604800"
  CART_DRIVER: "memory"
  CATALOG_TIMEOUT_MS: "2000"
  CATALOG_URL: "http://catalog-service.shopstack-dev.svc.cluster.local"

secrets:
  enabled: false

networkPolicy:
  enabled: true
  allowedClients:
    - storefront
    - checkout-service
  allowIngressController: false
  allowPrometheus: true
  egressAllowSameNamespace: true
  allowDatabaseEgress: false

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 300m
    memory: 320Mi

podDisruptionBudget:
  enabled: false
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65

ingress:
  enabled: false
  className: nginx
  host: "cart-service.dev.shopstack.example.com"
  tls:
    enabled: false

monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
  canaryServiceMonitor: false
  dashboard:
    enabled: true

analysis:
  prometheusAddress: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
  canaryOnly: false
