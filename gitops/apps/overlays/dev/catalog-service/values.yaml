# DEV values for catalog-service.
#
# Composed by the kustomization next to this file (Kustomize helmCharts).
# Promotion changes the image reference in kustomization.yaml, not this file.
# Flip to managed Postgres (see docs/environments.md):
#   config:   { DB_DRIVER: postgres }
#   secrets:  { enabled: true, data: [{ name: DATABASE_URL, remoteRef: { key: shopstack/<env>/catalog, property: url } }] }
#   migrations: { enabled: true, args: ["apps/catalog-service/scripts/migrate.js"] }

global:
  environment: dev
  imageRegistry: ghcr.io/parulbedi25

image:
  repository: shopstack/catalog-service
  pullPolicy: IfNotPresent

tier: core
replicaCount: 1
workload:
  kind: Deployment

config:
  NODE_ENV: "development"
  DEPLOYMENT_ENVIRONMENT: "dev"
  LOG_LEVEL: "debug"
  LOG_PRETTY: "false"
  SERVICE_NAME: "catalog-service"
  ALLOW_CHAOS: "true"
  CACHE_TTL_MS: "1000"
  METRICS_REFRESH_MS: "15000"
  DB_DRIVER: "memory"

secrets:
  enabled: false

networkPolicy:
  enabled: true
  allowedClients:
    - storefront
    - cart-service
    - checkout-service
  allowIngressController: false
  allowPrometheus: true
  egressAllowSameNamespace: true
  allowDatabaseEgress: false

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 300m
    memory: 320Mi

podDisruptionBudget:
  enabled: false
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65

ingress:
  enabled: false
  className: nginx
  host: "catalog-service.dev.shopstack.example.com"
  tls:
    enabled: false

monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
  canaryServiceMonitor: false
  dashboard:
    enabled: true

analysis:
  prometheusAddress: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
  canaryOnly: false
