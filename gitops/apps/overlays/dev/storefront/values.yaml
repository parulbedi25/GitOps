# DEV values for storefront.
#
# Composed by the kustomization next to this file (Kustomize helmCharts).
# Promotion changes the image reference in kustomization.yaml, not this file.
# The only publicly routed service. Everything else is reachable only through
# the cluster network.

global:
  environment: dev
  imageRegistry: ghcr.io/parulbedi25

image:
  repository: shopstack/storefront
  pullPolicy: IfNotPresent

tier: edge
replicaCount: 1
workload:
  kind: Deployment

config:
  NODE_ENV: "development"
  DEPLOYMENT_ENVIRONMENT: "dev"
  LOG_LEVEL: "debug"
  LOG_PRETTY: "false"
  SERVICE_NAME: "storefront"
  ALLOW_CHAOS: "true"
  CATALOG_TIMEOUT_MS: "2500"
  CART_TIMEOUT_MS: "2500"
  CHECKOUT_TIMEOUT_MS: "10000"
  CATALOG_URL: "http://catalog-service.shopstack-dev.svc.cluster.local"
  CART_URL: "http://cart-service.shopstack-dev.svc.cluster.local"
  CHECKOUT_URL: "http://checkout-service.shopstack-dev.svc.cluster.local"
  COOKIE_SECURE: "false"

secrets:
  enabled: false

networkPolicy:
  enabled: true
  allowedClients: []
  allowIngressController: true
  allowPrometheus: true
  egressAllowSameNamespace: true
  allowDatabaseEgress: false

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 300m
    memory: 320Mi

podDisruptionBudget:
  enabled: false
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65

ingress:
  enabled: true
  className: nginx
  host: "storefront.dev.shopstack.example.com"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
  tls:
    enabled: false

monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
  canaryServiceMonitor: false
  dashboard:
    enabled: true

analysis:
  prometheusAddress: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
  canaryOnly: false
