# QA values for payments-service.
#
# Composed by the kustomization next to this file (Kustomize helmCharts).
# Promotion changes the image reference in kustomization.yaml, not this file.
# The PSP webhook signing key is the only secret this service needs. It is
# synced from the cloud secret manager by the External Secrets Operator; the
# local kind cluster uses ESO's fake provider (see gitops/platform/controllers).

global:
  environment: qa
  imageRegistry: ghcr.io/parulbedi25

image:
  repository: shopstack/payments-service
  pullPolicy: IfNotPresent

tier: critical
replicaCount: 2
workload:
  kind: Rollout
  progressDeadlineSeconds: 900

rollout:
  strategy: canary
  canary:
    trafficRouting:
      nginx:
        enabled: false
      steps:
        - setWeight: 20
        - pause: { duration: 30s }
        - analysis:
            templates:
              - templateName: "__SUCCESS_RATE__"
        - setWeight: 50
        - pause: { duration: 30s }
        - setWeight: 100

config:
  NODE_ENV: "staging"
  DEPLOYMENT_ENVIRONMENT: "qa"
  LOG_LEVEL: "info"
  LOG_PRETTY: "false"
  SERVICE_NAME: "payments-service"
  ALLOW_CHAOS: "true"
  PSP_DRIVER: "simulated"
  PSP_FAILURE_RATE: "0"
  DB_DRIVER: "memory"

secrets:
  enabled: true
  optional: true
  refreshInterval: 1h
  data:
    - name: PSP_WEBHOOK_SECRET
      remoteRef:
        key: shopstack/qa/payments/psp_webhook_secret

networkPolicy:
  enabled: true
  allowedClients:
    - checkout-service
  allowIngressController: false
  allowPrometheus: true
  egressAllowSameNamespace: true
  allowDatabaseEgress: false

resources:
  requests:
    cpu: 100m
    memory: 160Mi
  limits:
    cpu: 500m
    memory: 512Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65

ingress:
  enabled: false
  className: nginx
  host: "qa.shopstack.example.com"
  tls:
    enabled: true
    secretName: payments-service-tls

monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
  canaryServiceMonitor: true
  dashboard:
    enabled: true

analysis:
  prometheusAddress: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
  canaryOnly: true
