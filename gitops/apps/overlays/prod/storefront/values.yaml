# PROD values for storefront.
#
# Composed by the kustomization next to this file (Kustomize helmCharts).
# Promotion changes the image reference in kustomization.yaml, not this file.
# The only publicly routed service. Everything else is reachable only through
# the cluster network.

global:
  environment: prod
  imageRegistry: ghcr.io/parulbedi25

image:
  repository: shopstack/storefront
  pullPolicy: IfNotPresent

tier: edge
replicaCount: 3
workload:
  kind: Rollout
  progressDeadlineSeconds: 900

rollout:
  strategy: canary
  canary:
    trafficRouting:
      nginx:
        enabled: true
        stableIngress: storefront
      steps:
        - setWeight: 5
        - pause: { duration: 120s }
        - analysis:
            templates:
              - templateName: "__SUCCESS_RATE__"
        - setWeight: 25
        - pause: { duration: 300s }
        - analysis:
            templates:
              - templateName: "__SUCCESS_RATE__"
        - setWeight: 50
        - pause: { duration: 300s }
        - setWeight: 100

config:
  NODE_ENV: "production"
  DEPLOYMENT_ENVIRONMENT: "prod"
  LOG_LEVEL: "info"
  LOG_PRETTY: "false"
  SERVICE_NAME: "storefront"
  ALLOW_CHAOS: "false"
  CATALOG_TIMEOUT_MS: "2500"
  CART_TIMEOUT_MS: "2500"
  CHECKOUT_TIMEOUT_MS: "10000"
  CATALOG_URL: "http://catalog-service.shopstack-prod.svc.cluster.local"
  CART_URL: "http://cart-service.shopstack-prod.svc.cluster.local"
  CHECKOUT_URL: "http://checkout-service.shopstack-prod.svc.cluster.local"
  COOKIE_SECURE: "true"

secrets:
  enabled: false

networkPolicy:
  enabled: true
  allowedClients: []
  allowIngressController: true
  allowPrometheus: true
  egressAllowSameNamespace: true
  allowDatabaseEgress: false

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: 1000m
    memory: 768Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65

ingress:
  enabled: true
  className: nginx
  host: "shopstack.example.com"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
    secretName: storefront-tls

monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
  canaryServiceMonitor: true
  dashboard:
    enabled: true

analysis:
  prometheusAddress: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
  canaryOnly: true
