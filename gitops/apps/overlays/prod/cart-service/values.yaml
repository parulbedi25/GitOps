# PROD values for cart-service.
#
# Composed by the kustomization next to this file (Kustomize helmCharts).
# Promotion changes the image reference in kustomization.yaml, not this file.
# Production switch for the cart store (Redis keeps carts across pod restarts):
#   config:  { CART_DRIVER: redis }
#   secrets: { enabled: true, data: [{ name: REDIS_URL, remoteRef: { key: shopstack/<env>/cart, property: url } }] }

global:
  environment: prod
  imageRegistry: ghcr.io/parulbedi25

image:
  repository: shopstack/cart-service
  pullPolicy: IfNotPresent

tier: core
replicaCount: 3
workload:
  kind: Rollout
  progressDeadlineSeconds: 900

rollout:
  strategy: canary
  canary:
    trafficRouting:
      nginx:
        enabled: false
      steps:
        - setWeight: 5
        - pause: { duration: 120s }
        - analysis:
            templates:
              - templateName: "__SUCCESS_RATE__"
        - setWeight: 25
        - pause: { duration: 300s }
        - analysis:
            templates:
              - templateName: "__SUCCESS_RATE__"
        - setWeight: 50
        - pause: { duration: 300s }
        - setWeight: 100

config:
  NODE_ENV: "production"
  DEPLOYMENT_ENVIRONMENT: "prod"
  LOG_LEVEL: "info"
  LOG_PRETTY: "false"
  SERVICE_NAME: "cart-service"
  ALLOW_CHAOS: "false"
  TAX_RATE_BPS: "825"
  SHIPPING_FEE_CENTS: "599"
  FREE_SHIPPING_THRESHOLD_CENTS: "7500"
  CART_TTL_SECONDS: "604800"
  CART_DRIVER: "memory"
  CATALOG_TIMEOUT_MS: "2000"
  CATALOG_URL: "http://catalog-service.shopstack-prod.svc.cluster.local"

secrets:
  enabled: false

networkPolicy:
  enabled: true
  allowedClients:
    - storefront
    - checkout-service
  allowIngressController: false
  allowPrometheus: true
  egressAllowSameNamespace: true
  allowDatabaseEgress: false

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: 1000m
    memory: 768Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65

ingress:
  enabled: false
  className: nginx
  host: "shopstack.example.com"
  tls:
    enabled: true
    secretName: cart-service-tls

monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
  canaryServiceMonitor: true
  dashboard:
    enabled: true

analysis:
  prometheusAddress: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
  canaryOnly: true
