# External Secrets Operator — pulls secrets from the cloud at runtime.
replicaCount: 2

leaderElect: true

serviceMonitor:
  # Declared in gitops/platform/observability/servicemonitors.yaml (see there).
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 500m
    memory: 256Mi

webhook:
  replicaCount: 2
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

certController:
  replicaCount: 1
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Refresh cadence is driven by each ExternalSecret (refreshInterval: 1h in the
# chart). The operator also watches the store and re-syncs on change.
concurrent: 4

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault
