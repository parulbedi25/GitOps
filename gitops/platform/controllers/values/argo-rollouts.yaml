# Argo Rollouts — progressive delivery controller.
installCRDs: true

controller:
  replicas: 1
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false # scraped through servicemonitors.yaml so labels stay consistent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Rollouts must be able to patch Services and Ingresses for traffic splitting.
  # These RBAC rules ship with the chart; nothing custom is required for nginx.
  nodeSelector: {}
  tolerations: []

dashboard:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # No public ingress: reach it with
  #   kubectl port-forward -n argo-rollouts svc/argo-rollouts-dashboard 3100:3100
  ingress:
    enabled: false

notifications:
  enabled: false
