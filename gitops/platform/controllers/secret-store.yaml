# ─────────────────────────────────────────────────────────────────────────────
# ClusterSecretStore — the bridge between ExternalSecrets in Git and the cloud
# secret manager that actually holds the values.
#
# The provider below is the **fake** provider, which serves values from a
# Kubernetes Secret. It exists so the reference cluster (kind, no cloud account)
# can demonstrate the ExternalSecret contract end to end. Swap the provider block
# for AWS Secrets Manager / Vault / GCP Secret Manager in a real cluster — the
# ExternalSecret resources in the app overlays do not change at all.
#
#   apiVersion: external-secrets.io/v1beta1
#   kind: ClusterSecretStore
#   spec:
#     provider:
#       aws:
#         service: SecretsManager
#         region: eu-west-1
#         auth:
#           jwt:
#             serviceAccountRef: { name: external-secrets-sa, namespace: external-secrets }
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: cluster-secret-store
  labels:
    shopstack.io/managed-by: gitops
    shopstack.io/purpose: demo
spec:
  provider:
    fake:
      data:
        # Demo values. Real environments use a cloud provider; these keys only
        # exist to prove the wiring and are not secrets in any sense.
        - key: shopstack/grafana/admin
          value: '{"password":"admin"}'
          version: v1
        - key: shopstack/dev/payments/psp_webhook_secret
          value: dev-webhook-secret-not-a-real-key
          version: v1
        - key: shopstack/qa/payments/psp_webhook_secret
          value: qa-webhook-secret-not-a-real-key
          version: v1
        - key: shopstack/prod/payments/psp_webhook_secret
          value: prod-webhook-secret-not-a-real-key
          version: v1
        - key: shopstack/prod/database
          value: '{"url":"postgres://shopstack@postgres.shopstack-prod.svc.cluster.local:5432/shopstack"}'
          version: v1
        - key: shopstack/prod/cart
          value: '{"url":"redis://redis.shopstack-prod.svc.cluster.local:6379"}'
          version: v1
