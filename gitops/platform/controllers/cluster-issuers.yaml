# cert-manager issuers.
#
# Production certs come from Let's Encrypt via HTTP-01 through ingress-nginx.
# The kind demo cluster never reaches the internet from inside the pod network on
# a laptop, so it uses the self-signed issuer instead — the ingress annotations in
# the app overlays still point at letsencrypt-*, and `scripts/bootstrap-kind.sh`
# patches them to `selfsigned` for the local demo.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
  labels:
    shopstack.io/managed-by: gitops
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    shopstack.io/managed-by: gitops
spec:
  acme:
    # Staging has much higher rate limits — use it in dev/QA so a misconfigured
    # ingress cannot burn the weekly production limit.
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: platform-team@shopstack.example
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    shopstack.io/managed-by: gitops
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: platform-team@shopstack.example
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
