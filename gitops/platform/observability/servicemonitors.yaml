# ServiceMonitors for the platform controllers.
#
# They live here (not next to the charts) for one reason: the
# prometheus-operator CRDs only exist after the observability app syncs, so
# declaring them at controller-install time would fail on a fresh cluster.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argo-rollouts
  namespace: observability
  labels:
    app.kubernetes.io/part-of: shopstack-platform
    shopstack.io/managed-by: gitops
spec:
  namespaceSelector:
    matchNames: [argo-rollouts]
  selector:
    matchLabels:
      app.kubernetes.io/name: argo-rollouts-metrics
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ingress-nginx
  namespace: observability
  labels:
    app.kubernetes.io/part-of: shopstack-platform
    shopstack.io/managed-by: gitops
spec:
  namespaceSelector:
    matchNames: [ingress-nginx]
  selector:
    matchLabels:
      app.kubernetes.io/name: ingress-nginx
      app.kubernetes.io/instance: ingress-nginx
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cert-manager
  namespace: observability
  labels:
    app.kubernetes.io/part-of: shopstack-platform
    shopstack.io/managed-by: gitops
spec:
  namespaceSelector:
    matchNames: [cert-manager]
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
      app.kubernetes.io/instance: cert-manager
      app.kubernetes.io/component: controller
  endpoints:
    - port: http-metrics
      interval: 30s
      path: /metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: external-secrets
  namespace: observability
  labels:
    app.kubernetes.io/part-of: shopstack-platform
    shopstack.io/managed-by: gitops
spec:
  namespaceSelector:
    matchNames: [external-secrets]
  selector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
      app.kubernetes.io/instance: external-secrets
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kyverno
  namespace: observability
  labels:
    app.kubernetes.io/part-of: shopstack-platform
    shopstack.io/managed-by: gitops
spec:
  namespaceSelector:
    matchNames: [kyverno]
  selector:
    matchLabels:
      app.kubernetes.io/name: kyverno
  endpoints:
    - port: metrics-port
      interval: 30s
      path: /metrics
---
# Argo CD's own controller metrics: sync status, reconciliation latency, health.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd
  namespace: observability
  labels:
    app.kubernetes.io/part-of: shopstack-platform
    shopstack.io/managed-by: gitops
spec:
  namespaceSelector:
    matchNames: [argocd]
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-metrics
  endpoints:
    - port: metrics
      interval: 60s
      path: /metrics
