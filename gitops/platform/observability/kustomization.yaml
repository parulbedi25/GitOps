# ─────────────────────────────────────────────────────────────────────────────
# Observability stack (sync wave 10, after the prometheus-operator CRDs exist).
#
#   Prometheus         metrics storage + rule evaluation
#   Alertmanager       routing, grouping, silences
#   Grafana            dashboards (provisioned from this directory)
#   kube-state-metrics workload/API state (replicas, phase, restarts)
#   node-exporter      host metrics
#   Thanos sidecar     long-term/HA read path (optional, disabled by default)
#
# The dashboard ConfigMaps below are generated by Kustomize from the JSON files,
# so the dashboards are reviewed like code and versioned with the stack.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

resources:
  - grafana-admin.externalsecret.yaml
  - servicemonitors.yaml
  - rules/prometheus-rules.yaml

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 65.5.0
    releaseName: kube-prometheus-stack
    namespace: observability
    valuesFile: values/kube-prometheus-stack.yaml
    includeCRDs: true

# One ConfigMap per dashboard, labelled for the Grafana sidecar.
configMapGenerator:
  - name: grafana-dashboard-shopstack-overview
    files:
      - dashboards/shopstack-overview.json
    options:
      labels:
        grafana_dashboard: "1"
        shopstack.io/dashboard: overview
  - name: grafana-dashboard-shopstack-service-red
    files:
      - dashboards/shopstack-service-red.json
    options:
      labels:
        grafana_dashboard: "1"
        shopstack.io/dashboard: service-red
  - name: grafana-dashboard-shopstack-progressive-delivery
    files:
      - dashboards/shopstack-progressive-delivery.json
    options:
      labels:
        grafana_dashboard: "1"
        shopstack.io/dashboard: progressive-delivery
  - name: grafana-dashboard-shopstack-platform
    files:
      - dashboards/shopstack-platform.json
    options:
      labels:
        grafana_dashboard: "1"
        shopstack.io/dashboard: platform

labels:
  - pairs:
      app.kubernetes.io/part-of: shopstack
      shopstack.io/managed-by: gitops
    includeSelectors: false
