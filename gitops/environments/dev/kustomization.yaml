# ─────────────────────────────────────────────────────────────────────────────
# DEV — the first environment. Fast feedback beats gate-keeping here: plain
# Deployments, one replica, chaos enabled, debug logging, automatic sync.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shopstack-dev

resources:
  - namespace.yaml
  - ../../environments/base

patches:
  # Dev is deliberately small: it must fit in a laptop cluster.
  - target:
      kind: ResourceQuota
      name: shopstack-quota
    patch: |-
      - op: replace
        path: /spec/hard/requests.cpu
        value: "4"
      - op: replace
        path: /spec/hard/requests.memory
        value: 8Gi
      - op: replace
        path: /spec/hard/limits.cpu
        value: "8"
      - op: replace
        path: /spec/hard/limits.memory
        value: 16Gi
      - op: replace
        path: /spec/hard/pods
        value: "30"
  # Developers can trigger a promotion in dev without a platform engineer.
  - target:
      kind: Role
      name: shopstack-developer
    patch: |-
      - op: add
        path: /rules/-
        value:
          apiGroups: ["argoproj.io"]
          resources: ["rollouts/promote", "rollouts/retry", "rollouts/abort"]
          verbs: ["create", "patch"]

labels:
  - pairs:
      shopstack.io/environment: dev
      shopstack.io/cost-center: engineering
    includeSelectors: false
