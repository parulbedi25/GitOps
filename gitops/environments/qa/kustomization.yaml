# ─────────────────────────────────────────────────────────────────────────────
# QA — where canaries are exercised for the first time. Same release artefact as
# prod, two replicas, fast canary steps (30s), chaos allowed on request.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shopstack-qa

resources:
  - namespace.yaml
  - ../../environments/base

patches:
  - target:
      kind: ResourceQuota
      name: shopstack-quota
    patch: |-
      - op: replace
        path: /spec/hard/requests.cpu
        value: "6"
      - op: replace
        path: /spec/hard/requests.memory
        value: 12Gi
      - op: replace
        path: /spec/hard/limits.cpu
        value: "12"
      - op: replace
        path: /spec/hard/limits.memory
        value: 24Gi
      - op: replace
        path: /spec/hard/pods
        value: "40"

labels:
  - pairs:
      shopstack.io/environment: qa
      shopstack.io/cost-center: engineering
    includeSelectors: false
